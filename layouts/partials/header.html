<header class="site-header-container">
  <div class="site-header">
    <a alt="{{ .Site.Title }}" aria-label="index" href="/" class="site-title">{{- .Site.Title -}}</a>
    <nav>
      {{- range .Site.Menus.main -}}
      <div><a
          {{ if or ($.IsMenuCurrent .Menu .) ($.HasMenuCurrent .Menu .) -}}
          class="active"
          {{- end -}}
          alt="{{ .Title }}" href="{{ .URL }}">{{ title .Title }}</a></div>
      {{- end -}}
    </nav>
  </div>
</header>
