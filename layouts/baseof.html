<!DOCTYPE html>
<html lang="en" data-theme="matcha">
{{- partial "head.html" . -}}

<body>
    {{- if .IsHome -}}
        <div></div>
        <main class="index" id="content-start">
            {{- block "main" . }}{{- end }}
        </main>
        <div></div>
    {{- else -}}
        {{- partial "header.html" . -}}
        <main id="content-start">
            {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
    {{- end -}}
</body>

</html>
