{{ define "main" }}
<div>
    <header>
        <div class="index-img-container">
            {{- $img := resources.Get "fujimirror.webp" -}}
            <img width="220" height="220" src="{{- $img.Permalink -}}" />
        </div>
        <h1 class="site-title">{{ .Site.Title }}</h1>
    </header>
    <nav>
      {{- $page := . -}}
      {{- range .Site.Menus.index -}}
      <div><a
          alt="{{ .Title }}" href="{{ .URL }}">{{ title .Title }}</a></div>
      {{- end -}}
    </nav>
</div>
{{ end }}
